name: Notas do Dia

on:
  # Agendamento desligado em 2026-09-17 (viagem) - por ora só disparo manual.
  # Para religar, descomente as duas linhas abaixo.
  # schedule:
    # 00:30 UTC = 06:00 IST, mesmo horário do cron local que isto substitui.
    # Segunda a sábado: às 00:30 UTC o dia da semana em IST é o mesmo, então o
    # 1-6 daqui casa com o "pula domingo" que generate_and_send() aplica em IST.
    # O agendador do GitHub atrasa com frequência (10-30min) e ocasionalmente
    # pula execuções - para um boletim diário isso é tolerável, mas não é o
    # relógio pontual que o cron local era.
    #   - cron: '30 0 * * 1-6'
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Enviar o e-mail de verdade para a lista (desmarcado = só gera e publica como artifact)'
        type: boolean
        default: false

# Uma rodada pendurada não pode encavalar com a do dia seguinte.
concurrency:
  group: notas-do-dia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    # Teto do job. O watchdog de 15min dentro do script cobre só a execução;
    # isto cobre também checkout e instalação de dependências.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Expor ChromeDriver em /usr/bin/chromedriver
        # O pm_scraper procura exatamente esse caminho antes de cair no
        # webdriver-manager (pm_scraper.py:337). Com o link, o fallback que baixa
        # o binário a cada run nunca é exercido no CI.
        run: sudo ln -sf "$CHROMEWEBDRIVER/chromedriver" /usr/bin/chromedriver

      - name: Restaurar arquivo de sínteses
        # Alimenta o _load_previous_synthesis() (generate_daily_notes.py:59), que
        # lê as 3 sínteses anteriores para dar continuidade ao texto. A chave leva
        # o run_id para que cada execução salve uma versão nova; o restore-keys
        # recupera a mais recente. Cache é best-effort: se for evictado, a rodada
        # segue sem contexto de continuidade em vez de falhar.
        uses: actions/cache@v4
        with:
          path: logs/arquivo
          key: notas-arquivo-${{ github.run_id }}
          restore-keys: notas-arquivo-

      - name: Gerar e enviar
        # No disparo agendado 'enviar' vem vazio, então o padrão é enviar de
        # verdade; a simulação só existe para o disparo manual desmarcado.
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: '587'
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USE_TLS: 'True'
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          SUMMARIZER_PROVIDER: gemini
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIMEZONE: Asia/Kolkata
        # load_dotenv() não sobrescreve o ambiente e não há .env no runner,
        # então estas variáveis são a única fonte de configuração aqui.
        run: |
          if [ "${{ github.event.inputs.enviar }}" = "false" ]; then
            echo "::notice::Modo simulação - scraping e síntese rodam, e-mail NÃO é enviado"
            python - <<'PY'
          from app.core.date_utils import get_target_dates
          from generate_daily_notes import generate_daily_notes
          import sys

          datas = get_target_dates()
          print(f"Datas-alvo: {datas}")
          html = generate_daily_notes(datas)
          if not html:
              print("Nenhum documento encontrado ou falha na geração")
              sys.exit(1)
          print(f"HTML gerado: {len(html)} caracteres - e-mail suprimido")
          PY
          else
            python generate_daily_notes.py
          fi

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs/*.log
            logs/arquivo/*.html
          if-no-files-found: ignore
          retention-days: 14
